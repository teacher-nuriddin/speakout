<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speakout A1 — uy vazifasi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // ⚙️ SOZLASH: Apps Script "Web app" havolasini shu yerga qo'ying (…/exec bilan tugaydi)
  window.API_URL = 'https://script.google.com/macros/s/AKfycbxzwELbXfrWjh6s5f0cCi7yEkxpg8_vPDoiwE496wpty0jcFlAQWktuxm_L8SMpwyn6/exec';
</script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f2f6);
  --sec:var(--tg-theme-section-bg-color,var(--bg));
  --text:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#8a8f98);
  --link:var(--tg-theme-link-color,#2481cc);
  --btn:var(--tg-theme-button-color,#2481cc);
  --btnt:var(--tg-theme-button-text-color,#fff);
  --danger:var(--tg-theme-destructive-text-color,#e5484d);
  --ok:#22a559;--okbg:rgba(34,165,89,.14);--badbg:rgba(229,72,77,.13);--warn:#d98a00;--warnbg:rgba(217,138,0,.14);
  --line:color-mix(in srgb,var(--hint) 28%,transparent);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg2);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--link)}
#app{max-width:720px;margin:0 auto;padding:12px 12px 24px}
h1{font-size:22px;margin:6px 4px 12px}
h2{font-size:18px;margin:18px 4px 8px}
h3{font-size:16px;margin:0 0 6px}
.hint{color:var(--hint);font-size:14px}
.small{font-size:13px}
.card{background:var(--sec);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--btn);color:var(--btnt);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.block{width:100%}
.btn.sec{background:color-mix(in srgb,var(--btn) 14%,transparent);color:var(--btn)}
.btn.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:44px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--btn)}
label.f{display:block;margin:10px 0 4px;font-size:14px;color:var(--hint)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--bg2);color:var(--hint)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--danger)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.blue{background:color-mix(in srgb,var(--btn) 14%,transparent);color:var(--btn)}
.list .it{display:flex;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.progress{height:6px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;background:var(--btn);border-radius:9px}
.center{text-align:center}
.empty{padding:30px 10px;text-align:center;color:var(--hint)}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--btn);border-radius:50%;animation:sp 0.8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,20,20,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;z-index:50;display:none}
/* pastki menyu */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--sec);border-top:1px solid var(--line);display:none;padding-bottom:env(safe-area-inset-bottom);z-index:20}
#nav .in{max-width:720px;margin:0 auto;display:flex}
#nav button{flex:1;border:0;background:none;color:var(--hint);font:600 11px/1.2 inherit;padding:8px 2px 9px;position:relative;cursor:pointer}
#nav button .ic{display:block;font-size:20px;line-height:24px}
#nav button.on{color:var(--btn)}
#nav .bd{position:absolute;top:3px;left:calc(50% + 6px);background:var(--danger);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px}
/* mashqlar */
.ex{background:var(--sec);border-radius:var(--r);padding:14px;margin:12px 0}
.ex .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex .instr{font-weight:600;margin:6px 0 2px}
.ex .uz{color:var(--hint);font-size:13.5px;margin-bottom:10px}
.ex .example{font-size:14px;color:var(--hint);background:var(--bg2);border-radius:10px;padding:7px 10px;margin:6px 0 10px}
.passage{background:var(--bg2);border-radius:12px;padding:12px;font-size:15px;white-space:pre-line;margin:8px 0 12px}
.passage b{display:block}
.snake{word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:1px}
.ex img.pic{width:100%;border-radius:10px;background:#fff;display:block;margin:6px 0 10px;min-height:60px;cursor:zoom-in}
.q{padding:10px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .p{margin-bottom:6px}
.q.inl{display:grid;grid-template-columns:minmax(0,1fr) 48%;gap:2px 10px;align-items:center}
.q.inl .p{margin:0}.q.inl .mk{grid-column:1/-1}
.q .num{font-weight:700;color:var(--hint);margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1.5px solid var(--line);border-radius:11px;padding:8px 12px;background:var(--bg);cursor:pointer;user-select:none;font-size:15px}
.opt.sel{border-color:var(--btn);background:color-mix(in srgb,var(--btn) 13%,var(--bg));font-weight:600}
.opt.imgopt{padding:4px;width:calc(50% - 4px)}
.opt.imgopt img{width:100%;display:block;border-radius:8px;background:#fff}
.gapline{margin:5px 0;line-height:2.2}
.gapline select,.gapline input{display:inline-block;width:auto;min-width:92px;padding:4px 8px;margin:0 2px;border-radius:8px;vertical-align:baseline}
.gapline .pre{font-weight:700}
.exfill{color:var(--btn);font-weight:600;text-decoration:underline}
.box{display:flex;flex-wrap:wrap;gap:6px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;margin-bottom:10px}
.box span{background:var(--bg2);border-radius:8px;padding:2px 8px;font-size:14px}
.ok-mark,.bad-mark{font-weight:800;margin-left:4px}
.ok-mark{color:var(--ok)}.bad-mark{color:var(--danger)}
.is-ok{border-color:var(--ok)!important;background:var(--okbg)!important}
.is-bad{border-color:var(--danger)!important;background:var(--badbg)!important}
.correct{font-size:13.5px;color:var(--ok);margin-top:4px}
.tokens{display:flex;flex-wrap:wrap;gap:6px;min-height:42px;padding:6px;border-radius:10px}
.tokens.ans{border:1.5px dashed var(--line);background:var(--bg)}
.tok{background:var(--bg2);border:1.5px solid var(--line);border-radius:9px;padding:5px 10px;cursor:pointer;user-select:none}
.tok.used{opacity:.25;pointer-events:none}
.hl{display:inline-block;padding:2px 4px;margin:2px 1px;border-radius:6px;cursor:pointer;border-bottom:2px solid transparent}
.hl.sel{border-bottom-color:var(--btn);background:color-mix(in srgb,var(--btn) 15%,transparent);font-weight:700}
.exfoot{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.score{font-size:18px;font-weight:800}
.notice{background:var(--warnbg);color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.notice.blue{background:color-mix(in srgb,var(--btn) 12%,transparent)}
.audio{margin:6px 0 10px}
.audio audio{width:100%}
.timer{position:sticky;top:0;z-index:10;background:var(--btn);color:var(--btnt);border-radius:12px;padding:8px 12px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:8px}
/* jadval */
.tablewrap{overflow:auto;border-radius:var(--r);background:var(--sec);max-height:70vh}
table.res{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.res th,table.res td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
table.res th{position:sticky;top:0;background:var(--sec);z-index:2;font-size:12px;color:var(--hint);max-width:90px;white-space:normal}
table.res td:first-child,table.res th:first-child{position:sticky;left:0;background:var(--sec);text-align:left;z-index:3;max-width:150px;overflow:hidden;text-overflow:ellipsis}
td.c-x{color:var(--danger);font-weight:800}
td.c-full{background:var(--okbg)}td.c-mid{background:var(--warnbg)}td.c-low{background:var(--badbg)}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:.2s}
.switch span:before{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span:before{transform:translateX(18px)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
.zoom img{width:100%;max-width:1000px;background:#fff;margin:auto}
.zoom img.big{width:220%;max-width:none}
.zoom .x{position:fixed;top:10px;right:12px;color:#fff;font-size:30px;background:rgba(0,0,0,.4);border-radius:50%;width:44px;height:44px;border:0}
.flash{perspective:900px;margin:14px 0}
.fcard{background:var(--sec);border-radius:18px;min-height:220px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.fcard .w{font-size:30px;font-weight:800}
.fcard .pr{color:var(--hint);margin-top:4px}
.fcard .exs{margin-top:14px;font-style:italic}
.fcard .tr{margin-top:14px;font-size:22px;font-weight:700;color:var(--btn)}
.tabs{display:flex;gap:6px;background:var(--bg2);padding:4px;border-radius:12px;margin:8px 0}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font:600 14px inherit;color:var(--hint);cursor:pointer}
.tabs button.on{background:var(--sec);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
</style>
</head>
<body>
<div id="app"><div class="spinner"></div></div>
<div id="nav"><div class="in"></div></div>
<div id="toast"></div>
<script>
'use strict';
// ====================================================================== asoslar
const tg = window.Telegram && window.Telegram.WebApp;
const INIT = (tg && tg.initData) || window.__DEV_INITDATA || '';
if (tg) { try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// kontent matni (o'z faylimizdan) — faqat b, i, u, span ruxsat
const rich = s => esc(s).replace(/&lt;(\/?)(b|i|u)&gt;/g, '<$1$2>').replace(/&lt;span class=&#39;(\w+)&#39;&gt;/g, '<span class="$1">').replace(/&lt;\/span&gt;/g, '</span>')
  .replace(/__(.+?)__/g, '<u>$1</u>').replace(/\[\[(.+?)\]\]/g, '<span class="exfill">$1</span>');
const app = $('#app');
const S = { me: null, view: 'student', stack: [], tab: 'home', overview: null, group: '' };

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = 'none'), ms);
}
function haptic(type) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
function loading() { app.innerHTML = '<div class="spinner"></div>'; }
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const m = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'][d.getMonth()];
  return d.getDate() + '-' + m + ', ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function toLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso); const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fromLocalInput(v) { return v ? new Date(v).toISOString() : ''; }

async function api(action, payload = {}, opts = {}) {
  const body = JSON.stringify(Object.assign({ action, initData: INIT }, payload));
  let lastErr;
  for (let i = 0; i < 4; i++) {
    try {
      const r = await fetch(window.API_URL, { method: 'POST', body, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow' });
      const j = await r.json();
      if (!j.ok) {
        if (j.error === 'BUSY' && i < 3) { await new Promise(r => setTimeout(r, 1500 * (i + 1))); continue; }
        const e = new Error(j.message || j.error); e.code = j.error; throw e;
      }
      return j.data;
    } catch (e) {
      lastErr = e;
      if (e.code) break; // server javobi — qayta urinmaymiz
      await new Promise(r => setTimeout(r, 1200 * (i + 1)));
    }
  }
  if (!opts.silent) toast(lastErr.code ? lastErr.message : "Internet bilan bog'lanishda muammo. Qayta urinib ko'ring.");
  throw lastErr;
}

// ---------------------------------------------------------------- media (rasm/audio) — server orqali
const mediaCache = new Map();
async function mediaUrl(name) {
  if (mediaCache.has(name)) return mediaCache.get(name);
  const p = api('media', { name }).then(d => {
    const bin = atob(d.data); const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([arr], { type: d.mime }));
  });
  mediaCache.set(name, p);
  p.catch(() => mediaCache.delete(name));
  return p;
}
function hydrateImages(root = app) {
  $$('img[data-media]', root).forEach(img => {
    const n = img.getAttribute('data-media'); img.removeAttribute('data-media');
    mediaUrl(n).then(u => (img.src = u)).catch(() => (img.alt = 'Rasm yuklanmadi'));
    img.addEventListener('click', () => zoom(img));
  });
}
function zoom(img) {
  if (!img.src) return;
  const z = document.createElement('div'); z.className = 'zoom';
  z.innerHTML = '<button class="x">×</button><img src="' + img.src + '">';
  z.querySelector('img').onclick = e => e.target.classList.toggle('big');
  z.querySelector('.x').onclick = () => z.remove();
  document.body.appendChild(z);
}

// ---------------------------------------------------------------- navigatsiya
function go(fn, push = true) {
  if (push && S.current) S.stack.push(S.current);
  S.current = fn; window.scrollTo(0, 0); fn();
  updateBack();
}
function back() { const f = S.stack.pop(); if (f) { S.current = f; f(); updateBack(); } }
function updateBack() {
  if (!tg || !tg.BackButton) return;
  if (S.stack.length) tg.BackButton.show(); else tg.BackButton.hide();
}
if (tg && tg.BackButton) tg.BackButton.onClick(back);
function resetTo(fn) { S.stack = []; go(fn, false); }

function setNav(items, active) {
  const nav = $('#nav');
  if (!items) { nav.style.display = 'none'; return; }
  nav.style.display = 'block';
  nav.querySelector('.in').innerHTML = items.map(i =>
    `<button data-k="${i.k}" class="${i.k === active ? 'on' : ''}"><span class="ic">${i.ic}</span>${esc(i.t)}${i.badge ? `<span class="bd">${i.badge}</span>` : ''}</button>`).join('');
  $$('#nav button').forEach(b => (b.onclick = () => { S.tab = b.dataset.k; i18nNav(); }));
}
function i18nNav() { (S.view === 'teacher' ? teacherTab : studentTab)(); }

// ====================================================================== kirish
async function boot() {
  if (!INIT) {
    app.innerHTML = `<div class="card center"><h1>📱 Telegram orqali oching</h1><p class="hint">Bu ilova faqat Telegram ichida, bot orqali ishlaydi.</p></div>`;
    return;
  }
  if (!window.API_URL || window.API_URL.indexOf('http') !== 0 && window.API_URL.indexOf('/') !== 0) {
    app.innerHTML = `<div class="card"><h3>⚙️ Sozlash tugallanmagan</h3><p class="hint">index.html faylida API_URL ko'rsatilmagan.</p></div>`;
    return;
  }
  loading();
  try { S.me = await api('me'); } catch (e) {
    app.innerHTML = `<div class="card center"><h3>Xatolik</h3><p class="hint">${esc(e.message)}</p><button class="btn" onclick="boot()">Qayta urinish</button></div>`;
    return;
  }
  if (S.me.isTeacher) { S.view = 'teacher'; S.tab = 'requests'; teacherTab(); return; }
  const st = S.me.student;
  if (st && st.status === 'approved') { S.tab = 'home'; studentTab(); return; }
  setNav(null);
  if (!st) return requestForm();
  if (st.status === 'pending') return pendingScreen();
  return deniedScreen(st.status);
}

function teacherLink() {
  return `<p class="center small" style="margin-top:26px"><a href="#" id="tlink">Men o'qituvchiman</a></p>`;
}
function bindTeacherLink() {
  const l = $('#tlink'); if (!l) return;
  l.onclick = e => { e.preventDefault(); claimForm(); };
}
function claimForm() {
  app.innerHTML = `<div class="card"><h3>👩‍🏫 O'qituvchi kirishi</h3>
    <p class="hint small">Parol faqat bir marta so'raladi. Keyin ilova sizni Telegram hisobingiz orqali taniydi.</p>
    <label class="f">Parol</label><input id="pw" type="password" autocomplete="off">
    <div style="height:12px"></div><button class="btn block" id="go">Kirish</button>
    <div style="height:8px"></div><button class="btn sec block" id="cancel">Orqaga</button></div>`;
  $('#cancel').onclick = boot;
  $('#go').onclick = async () => {
    try { await api('t_claim', { password: $('#pw').value }); toast("Xush kelibsiz! Siz o'qituvchi sifatida tanildingiz."); boot(); } catch (e) {}
  };
}

function requestForm() {
  const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
  app.innerHTML = `<h1>👋 Xush kelibsiz!</h1>
  <div class="card"><p>Bu — ingliz tili to'garagining uy vazifalari ilovasi (<b>Speakout A1</b>).</p>
  <p class="hint small">Kirish uchun ism-familiyangizni yozing va ruxsat so'rang. O'qituvchi tasdiqlagach, vazifalar ochiladi.</p>
  <label class="f">Ism</label><input id="fn" value="${esc(u.first_name || '')}" maxlength="40">
  <label class="f">Familiya</label><input id="ln" value="${esc(u.last_name || '')}" maxlength="40">
  <div style="height:14px"></div><button class="btn block" id="send">Ruxsat so'rash</button></div>${teacherLink()}`;
  bindTeacherLink();
  $('#send').onclick = async () => {
    const b = $('#send'); b.disabled = true;
    try { await api('request', { firstName: $('#fn').value, lastName: $('#ln').value }); haptic('success'); boot(); }
    catch (e) { b.disabled = false; }
  };
}
function pendingScreen() {
  app.innerHTML = `<div class="card center" style="margin-top:30px"><div style="font-size:52px">⏳</div>
  <h3>So'rovingiz yuborildi</h3><p class="hint">O'qituvchi ruxsat berishi bilan vazifalar shu yerda paydo bo'ladi.</p>
  <button class="btn sec" onclick="boot()">Tekshirish</button></div>${teacherLink()}`;
  bindTeacherLink();
}
function deniedScreen(status) {
  app.innerHTML = `<div class="card center" style="margin-top:30px"><div style="font-size:52px">🚫</div>
  <h3>${status === 'revoked' ? 'Ruxsatingiz bekor qilingan' : "So'rovingiz rad etildi"}</h3>
  <p class="hint">Agar bu xato bo'lsa, o'qituvchingizga murojaat qiling yoki qayta so'rov yuboring.</p>
  <button class="btn sec" id="again">Qayta so'rov yuborish</button></div>${teacherLink()}`;
  bindTeacherLink();
  $('#again').onclick = requestForm;
}

// ====================================================================== O'QUVCHI
function studentTab() {
  const items = [{ k: 'home', ic: '📚', t: 'Vazifalar' }];
  if (S.me.isTeacher) items.push({ k: 'panel', ic: '👩‍🏫', t: 'Panelga qaytish' });

function assignmentRow(a) {

  } else {

    right = a.pending ? `<span class="chip warn">✍️ tekshirilmoqda</span>` : full ? `<span class="chip ok">✓ ${a.score}/${a.max}</span>`
      : a.done ? `<span class="chip warn">${a.done}/${a.total}</span>` : `<span class="chip">${a.total} mashq</span>`;

function rng(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) { h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return function () { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
function shuffled(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  const r = rng(String(A.seed || '') + id);

function setupTimer(A) {

function letter(i) { return 'abcdefghij'[i] || ''; }
function renderBody(ex) {

    })}</div>`).join('');
  }
  if (t === 'mcq' || t === 'match') {
    return ex.items.map((it, n) => {

      const v = ans[it.id];
      let body;
      if (t === 'match') {

    }).join('');
  }
  if (t === 'text') {

      const v = ans[it.id] != null ? ans[it.id] : (it.prefill || '');
      const field = ex.long ? `<textarea data-i="${esc(it.id)}" rows="2" autocapitalize="sentences" spellcheck="false">${esc(v)}</textarea>`
        : `<input data-i="${esc(it.id)}" value="${esc(v)}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
      return `<div class="q ${ex.long ? '' : 'inl'}" data-q="${esc(it.id)}"><div class="p"><span class="num">${esc(it.id)}</span>${rich(it.prompt || '')}</div>${field}<div class="mk"></div></div>`;
    }).join('');
  }
  if (t === 'order') {
    return ex.items.map(it => {
      const v = ans[it.id] || '';
      return `<div class="q" data-q="${esc(it.id)}"><div class="p"><span class="num">${esc(it.id)}</span>${esc(it.speaker || '')}</div>
        <div class="tokens ans" data-ans></div><div class="tokens" data-src>${it.tokens.map((w, k) => `<span class="tok" data-k="${k}">${esc(w)}</span>`).join('')}</div>
        <div class="row" style="justify-content:space-between"><span class="hint small">${it.end ? 'Oxiri: ' + esc(it.end) : ''}</span><button class="btn sec sm" data-reset>↺ Qaytadan</button></div>
        <input type="hidden" data-i="${esc(it.id)}" value="${esc(v)}"><div class="mk"></div></div>`;
    }).join('');

  if (t === 'multi') {

        <div class="opts" data-multi="${esc(it.id)}">${ex.options.map((o, k) => imgs
          ? `<div class="opt imgopt ${sel.includes(o.k) ? 'sel' : ''}" data-v="${esc(o.k)}"><img data-media="${esc(o.img)}" alt="${k + 1}"></div>`
          : `<div class="opt ${sel.includes(o.k) ? 'sel' : ''}" data-v="${esc(o.k)}">${esc(o.t)}</div>`).join('')}</div><div class="mk"></div></div>`;

function collect(ex) {
  const el = $('#ex-' + CSS.escape(ex.id)); if (!el) return;
  const a = {};
  if (ex.type === 'set') { a['1'] = $$('[data-set]', el).map(i => i.value.trim()); }
  else if (ex.type === 'multi') { $$('[data-multi]', el).forEach(g => (a[g.dataset.multi] = $$('.opt.sel', g).map(o => o.dataset.v))); }
  else if (ex.type === 'highlight') { $$('[data-hl]', el).forEach(g => (a[g.dataset.hl] = $$('.hl.sel', g).map(o => Number(o.dataset.k)))); }
  else if (ex.type === 'mcq') { $$('.opts[data-i]', el).forEach(g => { const s = $('.opt.sel', g); if (s) a[g.dataset.i] = s.dataset.v; }); }
  else { $$('[data-i]', el).forEach(i => { if (i.value !== '') a[i.dataset.i] = i.value; }); }
  S.answers[ex.id] = a;
  const d = loadDraft(S.A.id); d[ex.id] = a; saveDraft(S.A.id, d);
}

function bindExercise(ex, A) {
  const el = $('#ex-' + CSS.escape(ex.id)); if (!el || !ex.active || !$('.body', el)) return;
  const audio = $('[data-audio]', el);
  if (audio) $('button', audio).onclick = async () => {
    const b = $('button', audio); b.disabled = true; b.textContent = 'Yuklanmoqda…';
    try { const u = await mediaUrl('audio:' + ex.audio); audio.innerHTML = `<audio controls preload="auto" src="${u}"></audio>`; }
    catch (e) { b.disabled = false; b.textContent = '▶ Qayta urinish'; }
  };
  const locked = ex.left === 0 || !A.canSubmit;
  const changed = () => collect(ex);
  // tanlov tugmalari
  $$('.opts[data-i] .opt', el).forEach(o => (o.onclick = () => { if (locked) return; $$('.opt', o.parentNode).forEach(x => x.classList.remove('sel')); o.classList.add('sel'); changed(); }));
  $$('.opts[data-multi] .opt', el).forEach(o => (o.onclick = () => { if (locked) return; o.classList.toggle('sel'); changed(); }));
  $$('.hl', el).forEach(o => (o.onclick = () => { if (locked) return; o.classList.toggle('sel'); changed(); }));
  $$('input,select,textarea', el).forEach(i => { i.addEventListener('input', changed); i.addEventListener('change', changed); if (locked) i.disabled = true; });
  // so'z tartibi
  $$('.q', el).forEach(q => {
    const src = $('[data-src]', q), dst = $('[data-ans]', q), hid = $('input[type=hidden]', q);
    if (!src) return;
    const it = ex.items.find(x => x.id === q.dataset.q);
    const order = [];
    const sync = () => {
      dst.innerHTML = order.map(k => `<span class="tok" data-k="${k}">${esc(it.tokens[k])}</span>`).join('');
      $$('.tok', src).forEach(t => t.classList.toggle('used', order.includes(Number(t.dataset.k))));
      let s = order.map(k => it.tokens[k]).join(' ');
      if (s && it.end) s += it.end;
      if (s) s = s.charAt(0).toUpperCase() + s.slice(1);
      hid.value = order.length === it.tokens.length ? s : (order.length ? s : '');
      $$('.tok', dst).forEach(t => (t.onclick = () => { if (locked) return; order.splice(order.indexOf(Number(t.dataset.k)), 1); sync(); changed(); }));
    };
    // oldingi javobni tiklash
    if (hid.value) {
      let hv = hid.value;
      if (it.end && hv.endsWith(it.end)) hv = hv.slice(0, -it.end.length);
      const words = hv.split(' ');
      const used = new Set();
      let okRestore = true;
      // ko'p so'zli tokenlar ("Petr and Jun") uchun ketma-ket moslashtirish
      let i = 0;
      while (i < words.length && okRestore) {
        let found = -1;
        for (let k = 0; k < it.tokens.length; k++) {
          if (used.has(k)) continue;
          const tw = it.tokens[k].split(' ');
          if (words.slice(i, i + tw.length).join(' ').toLowerCase() === it.tokens[k].toLowerCase()) { found = k; i += tw.length; break; }
        }
        if (found < 0) okRestore = false; else { used.add(found); order.push(found); }
      }
      if (!okRestore) order.length = 0;
    }
    $$('.tok', src).forEach(t => (t.onclick = () => { if (locked) return; order.push(Number(t.dataset.k)); sync(); changed(); }));
    $('[data-reset]', q).onclick = () => { if (locked) return; order.length = 0; sync(); changed(); };
    sync();
  });
  // yozma ish: so'zlar soni
  const wc = $('[data-wc]', el);
  if (wc) {
    const ta = $('textarea', el);
    const upd = () => { const n = (ta.value.trim().match(/\S+/g) || []).length; wc.textContent = `So'zlar: ${n}` + (ex.minWords ? ` (kerak: ${ex.minWords}–${ex.maxWords})` : ''); };
    ta.addEventListener('input', upd); upd();
  }
  if (ex.last) showResult(ex, { score: ex.last.score, max: ex.last.max, status: ex.last.status, result: ex.last.result, correct: ex.last.correct, left: ex.left });
  renderFoot(ex, A);
}

function renderFoot(ex, A) {
  const f = $('#foot-' + CSS.escape(ex.id)); if (!f) return;
  const timed = A.whole;
  let left = ex.left === null || ex.left === undefined ? '' : `<span class="hint small">Qolgan urinish: ${ex.left}</span>`;
  if (ex.type === 'teacher') { f.innerHTML = ''; return; }
  if (!A.canSubmit) { f.innerHTML = left; return; }
  if (ex.left === 0) { f.innerHTML = `<span class="hint small">Urinishlar tugagan.</span>`; return; }
  if (timed) { f.innerHTML = left; return; }
  f.innerHTML = `${left}<button class="btn" data-submit>${ex.used ? '🔁 Qayta tekshirish' : '✅ Tekshirish'}</button>`;
  $('[data-submit]', f).onclick = () => submitOne(ex, A);
}

async function submitOne(ex, A) {
  collect(ex);
  const a = S.answers[ex.id] || {};
  const filled = Object.values(a).filter(v => (Array.isArray(v) ? v.some(x => x !== '' && x != null) : String(v).trim() !== '')).length;
  if (!filled) { toast('Avval javob bering.'); return; }
  const expect = ex.type === 'set' ? 1 : (ex.gaps || ex.items || [1]).length;
  if (filled < expect && ex.type !== 'multi' && !(await confirmAsk("Hamma savolga javob bermadingiz. Baribir tekshirasizmi?"))) return;
  if (ex.type === 'writing') {
    const n = (String(a['1'] || '').match(/\S+/g) || []).length;
    if (ex.minWords && n < ex.minWords && !(await confirmAsk(`Siz ${n} ta so'z yozdingiz (kerak: ${ex.minWords}+). Baribir yuborasizmi?`))) return;
  }
  if (ex.left === 1 && !(await confirmAsk("Bu oxirgi urinishingiz. Tekshirasizmi?"))) return;
  const btn = $('#foot-' + CSS.escape(ex.id) + ' [data-submit]'); if (btn) { btn.disabled = true; btn.textContent = 'Tekshirilmoqda…'; }
  try {
    const d = await api('submit', { id: A.id, answers: { [ex.id]: a } });
    const r = d.results[ex.id];
    ex.used = r.used; ex.left = r.left;
    ex.last = { score: r.score, max: r.max, status: r.status, result: r.result, correct: r.correct, answers: a };
    const d2 = loadDraft(A.id); delete d2[ex.id]; saveDraft(A.id, d2);
    haptic(r.score === r.max ? 'success' : 'warning');
    const el = $('#ex-' + CSS.escape(ex.id));
    $('.head', el).outerHTML = exHeader(ex);
    // bog'liq mashqlarni ochish uchun sahifani yangilash
    if (A.exercises.some(e => e.requires === ex.id)) { const y = window.scrollY; await assignmentPage(A.id); window.scrollTo(0, y); return; }
    showResult(ex, Object.assign({}, r));
    if (ex.left === 0) $$('input,select,textarea', el).forEach(i => (i.disabled = true));
    renderFoot(ex, A);
  } catch (e) { if (btn) { btn.disabled = false; btn.textContent = '✅ Tekshirish'; } }
}

function showResult(ex, r) {
  const el = $('#ex-' + CSS.escape(ex.id)); if (!el) return;
  $$('.is-ok,.is-bad', el).forEach(x => x.classList.remove('is-ok', 'is-bad'));
  $$('.ok-mark,.bad-mark,.correct', el).forEach(x => x.remove());
  if (r.status === 'review') {
    const f = document.createElement('div'); f.className = 'notice blue'; f.innerHTML = "✍️ Ishingiz yuborildi. O'qituvchi tekshirgach, ball shu yerda ko'rinadi.";
    $('.body', el).after(f); return;
  }
  const res = r.result || {};
  const corr = r.correct || null;
  const mark = (node, ok, cAns) => {
    if (!node) return;
    const m = document.createElement('span'); m.className = ok ? 'ok-mark' : 'bad-mark'; m.textContent = ok ? '✓' : '✗';
    node.after(m);
    if (!ok && cAns != null) { const c = document.createElement('div'); c.className = 'correct'; c.textContent = "To'g'ri javob: " + cAns; m.after(c); }
  };
  if (ex.type === 'gap') {
    Object.keys(res).forEach(gid => {
      const i = $(`[data-i="${CSS.escape(gid)}"]`, el); if (!i) return;
      i.classList.add(res[gid].ok ? 'is-ok' : 'is-bad');
      if (!res[gid].ok && corr) i.title = corr[gid];
      if (!res[gid].ok && corr) { const s = document.createElement('span'); s.className = 'correct'; s.style.display = 'inline'; s.textContent = ' (' + corr[gid] + ')'; i.after(s); }
    });
  } else if (ex.type === 'set') {
    const flags = (res['1'] && res['1'].flags) || [];
    $$('[data-set]', el).forEach((i, k) => i.classList.add(flags[k] ? 'is-ok' : 'is-bad'));
    if (corr) { const c = document.createElement('div'); c.className = 'correct'; c.textContent = "Ranglar: " + corr['1'].join(', '); $('.mk', el).appendChild(c); }
  } else {
    $$('.q', el).forEach(q => {
      const id = q.dataset.q; const x = res[id]; if (!x) return;
      const target = $('.mk', q);
      if (ex.type === 'multi' && x.m > 1) {
        const m = document.createElement('span'); m.className = x.ok ? 'ok-mark' : 'bad-mark'; m.textContent = (x.ok ? '✓ ' : '') + x.s + '/' + x.m; target.appendChild(m);
        if (!x.ok && corr) { const c = document.createElement('div'); c.className = 'correct'; c.textContent = "To'g'ri: " + labelMulti(ex, corr[id]); target.appendChild(c); }
      } else {
        const fld = $('[data-i],[data-hl],[data-multi]', q);
        if (ex.type === 'mcq') { const so = $('.opt.sel', q); if (so) so.classList.add(x.ok ? 'is-ok' : 'is-bad'); }
        if (fld && fld.matches('input:not([type=hidden]),select,textarea')) fld.classList.add(x.ok ? 'is-ok' : 'is-bad');
        let c = corr ? corr[id] : null;
        if (c != null && ex.type === 'multi') c = labelMulti(ex, c);
        if (Array.isArray(c)) c = c.join(', ');
        const m = document.createElement('span'); m.className = x.ok ? 'ok-mark' : 'bad-mark'; m.textContent = x.ok ? '✓ to\'g\'ri' : '✗ noto\'g\'ri';
        target.appendChild(m);
        if (!x.ok && c != null) { const cc = document.createElement('div'); cc.className = 'correct'; cc.textContent = "To'g'ri javob: " + c; target.appendChild(cc); }
      }
    });
  }
}
function labelMulti(ex, keys) {
  return [].concat(keys).map(k => { const o = ex.options.find(x => x.k === k); return o && o.t ? o.t : (ex.options.indexOf(o) + 1) + '-rasm'; }).join(', ');
}

async function wordsPage(unit, mode) {
  loading();
  let d; try { d = await api('words', { unit }); } catch (e) { app.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  S.W = d; S.W.mode = mode || 'cards'; S.W.i = 0;
  renderWords();
}
function renderWords() {
  const d = S.W;
  let h = `<h1>${esc(d.title)}</h1><div class="card"><div class="row"><div class="grow">Bilgan so'zlaringiz</div><b>${d.knownPct}%</b></div>
    <div class="progress"><i style="width:${d.knownPct}%"></i></div><div class="hint small" style="margin-top:6px">So'z "bilingan" hisoblanadi, agar testda unga ketma-ket 2 marta to'g'ri javob bersangiz.</div></div>
    <div class="tabs"><button data-m="cards" class="${d.mode === 'cards' ? 'on' : ''}">🃏 Kartochkalar</button><button data-m="test" class="${d.mode === 'test' ? 'on' : ''}">📝 Mini-test</button></div><div id="wbody"></div>`;
  app.innerHTML = h;
  $$('.tabs button').forEach(b => (b.onclick = () => { d.mode = b.dataset.m; renderWords(); }));
  if (d.mode === 'cards') renderCard(); else startQuiz();
}
function renderCard() {
  const d = S.W; const w = d.words[d.i]; if (!w) return;
  const p = d.progress[w.en];
  $('#wbody').innerHTML = `<div class="hint center small">${d.i + 1} / ${d.words.length} ${p && p.st >= 2 ? '· ✅ bilasiz' : ''}</div>
    <div class="flash"><div class="fcard" id="fc"><div class="w">${esc(w.en)}</div><div class="pr">${esc(w.pron || '')}</div>
    <div class="exs">${esc(w.ex || '')}</div><div class="tr" id="tr" style="visibility:hidden">${esc(w.uz)}</div>
    <div class="hint small" style="margin-top:10px" id="tap">Tarjimani ko'rish uchun bosing</div></div></div>
    <div class="row"><button class="btn sec grow" id="prev">← Oldingi</button><button class="btn grow" id="next">Keyingi →</button></div>`;
  $('#fc').onclick = () => { $('#tr').style.visibility = 'visible'; $('#tap').style.display = 'none'; };
  $('#prev').onclick = () => { d.i = (d.i - 1 + d.words.length) % d.words.length; renderCard(); };
  $('#next').onclick = () => { d.i = (d.i + 1) % d.words.length; renderCard(); };
}
function startQuiz() {
  const d = S.W;
  const r = Math.random;
  // avval hali bilinmagan so'zlar
  const pool = shuffled(d.words, r).sort((a, b) => ((d.progress[a.en] || {}).st || 0) - ((d.progress[b.en] || {}).st || 0));
  const n = Math.min(10, d.words.length);
  d.q = pool.slice(0, n).map((w, k) => {
    const mode = k % 2 === 0 ? 'en2uz' : 'uz2en';
    const q = { w, mode };
    if (mode === 'en2uz') {
      const others = shuffled(d.words.filter(x => x.uz !== w.uz), r).slice(0, 3).map(x => x.uz);
      q.options = shuffled([w.uz].concat(others), r);
    }
    return q;
  });
  d.q = shuffled(d.q, r); d.qi = 0; d.res = [];
  renderQ();
}
function renderQ() {
  const d = S.W; const q = d.q[d.qi];
  if (!q) return finishQuiz();
  let h = `<div class="hint center small">${d.qi + 1} / ${d.q.length}</div><div class="card">`;
  if (q.mode === 'en2uz') {
    h += `<div class="hint small">Tarjimasini tanlang:</div><div style="font-size:26px;font-weight:800;margin:6px 0 12px">${esc(q.w.en)}</div>
      <div class="opts" style="flex-direction:column">${q.options.map(o => `<div class="opt" data-v="${esc(o)}">${esc(o)}</div>`).join('')}</div>`;
  } else {
    h += `<div class="hint small">Inglizchasini yozing:</div><div style="font-size:24px;font-weight:800;margin:6px 0 12px">${esc(q.w.uz)}</div>
      <input id="wa" autocomplete="off" autocapitalize="off" spellcheck="false"><div style="height:10px"></div><button class="btn block" id="wok">Javob berish</button>`;
  }
  h += '</div>';
  $('#wbody').innerHTML = h;
  const answer = v => { d.res.push({ en: q.w.en, mode: q.mode, answer: v }); d.qi++; renderQ(); };
  $$('#wbody .opt').forEach(o => (o.onclick = () => answer(o.dataset.v)));
  const wa = $('#wa');
  if (wa) { wa.focus(); $('#wok').onclick = () => answer(wa.value); wa.onkeydown = e => { if (e.key === 'Enter') answer(wa.value); }; }
}
async function finishQuiz() {
  const d = S.W;
  $('#wbody').innerHTML = '<div class="spinner"></div>';
  let r; try { r = await api('wordResult', { unit: d.unit, results: d.res }); } catch (e) { $('#wbody').innerHTML = '<div class="empty">Natija saqlanmadi.</div>'; return; }
  d.knownPct = r.knownPct;
  r.checked.forEach(c => { const p = d.progress[c.en] || { st: 0 }; p.st = c.ok ? (p.st || 0) + 1 : 0; d.progress[c.en] = p; });
  const right = r.checked.filter(c => c.ok).length;
  haptic(right === r.checked.length ? 'success' : 'warning');
  $('#wbody').innerHTML = `<div class="card center"><div class="score">${right} / ${r.checked.length}</div><div class="hint">Bilgan so'zlar: ${r.known} / ${r.total} (${r.knownPct}%)</div></div>
    <div class="card list">${r.checked.map(c => `<div class="it" style="cursor:default"><span class="${c.ok ? 'ok-mark' : 'bad-mark'}">${c.ok ? '✓' : '✗'}</span><div class="grow"><b>${esc(c.en)}</b> — ${esc(c.correct)}</div></div>`).join('')}</div>
    <button class="btn block" id="again">🔁 Yana test</button>`;
  $('#again').onclick = () => renderWords();
}

    const [aid, exid] = b.dataset.reset.split('|');
    if (!(await confirmAsk("Shu mashq bo'yicha urinishlar o'chiriladi va o'quvchi qayta topshira oladi. Davom etasizmi?"))) return;
    try { await api('t_resetAttempt', { tgId: id, assignmentId: aid, exerciseId: exid }); toast('Tayyor'); tStudentPage(id); } catch (e) {}
  }));
}

// ---------------------------------------------------------------- ochish/yopish
async function tAccess() {
  loading();
  try { if (!S.overview) await refreshOverview(); } catch (e) { return; }
  if (!S.group) { app.innerHTML = `<div class="card empty">Avval guruh yarating (Ko'proq → Guruhlar).</div>`; return; }
  let cat; try { cat = await api('t_catalog', { groupId: S.group }); } catch (e) { return; }
  S.catalog = cat;
  let h = `<h1>🔓 Vazifalarni ochish</h1><div class="card"><label class="f" style="margin-top:0">Guruh</label><select id="g">${groupOptions(S.group)}</select></div>`;
  if (!cat.length) h += `<div class="card empty">Kontent topilmadi. Drive papkasiga unitN.content.json va unitN.keys.json fayllarini yuklang.</div>`;
  cat.slice().reverse().forEach(u => {
    h += `<h2>${esc(u.title)}</h2>`;
    const byL = {};
    u.assignments.forEach(a => (byL[a.lesson || '★'] = byL[a.lesson || '★'] || []).push(a));
    Object.keys(byL).sort().forEach(l => {
      const lt = (u.lessons || []).find(x => x.id === l);
      const ids = byL[l].map(a => a.id).join(',');
      h += `<div class="card"><div class="row"><h3 class="grow" style="margin:0">${esc(lt ? lt.title : l === '★' ? "Unit bo'yicha" : l)}</h3>
        <button class="btn sec sm" data-bulk="${esc(ids)}" data-open="1">Hammasini ochish</button><button class="btn sec sm" data-bulk="${esc(ids)}" data-open="0">Yopish</button></div><div class="list">`;
      byL[l].forEach(a => {
        const s = a.settings;
        const miss = a.exercises.filter(e => e.audioMissing).length;
        const info = [s.deadline ? 'muddat ' + fmtDate(s.deadline) : '', s.attempts ? s.attempts + ' urinish' : 'cheksiz', s.timeLimit ? '⏱ ' + s.timeLimit + ' daq' : '',
          s.openFrom ? 'ochiladi ' + fmtDate(s.openFrom) : '', s.openUntil ? 'yopiladi ' + fmtDate(s.openUntil) : '', miss ? '🔇 ' + miss + ' audio yo\'q' : ''].filter(Boolean).join(' · ');
        h += `<div class="it" data-a="${esc(a.id)}"><div class="grow"><b>${esc(a.title)}</b>${a.kind === 'practice' ? ' <span class="chip blue">takrorlash</span>' : ''}<div class="hint small">${info}</div></div>
          <label class="switch" onclick="event.stopPropagation()"><input type="checkbox" data-sw="${esc(a.id)}" ${s.open ? 'checked' : ''}><span></span></label></div>`;
      });
      h += '</div></div>';
    });
  });
  app.innerHTML = h;
  $('#g').onchange = e => { S.group = e.target.value; tAccess(); };
  $$('[data-sw]').forEach(sw => (sw.onchange = async () => {
    try { S.catalog = await api('t_setAccess', { groupId: S.group, assignmentIds: [sw.dataset.sw], settings: { open: sw.checked } }); toast(sw.checked ? 'Ochildi 🔓' : 'Yopildi 🔒'); }
    catch (e) { sw.checked = !sw.checked; }
  }));
  $$('[data-bulk]').forEach(b => (b.onclick = async () => {
    try { await api('t_setAccess', { groupId: S.group, assignmentIds: b.dataset.bulk.split(','), settings: { open: b.dataset.open === '1' } }); tAccess(); } catch (e) {}
  }));
  $$('.it[data-a]').forEach(el => (el.onclick = () => settingsSheet(el.dataset.a)));
}

function findCat(id) { for (const u of S.catalog) for (const a of u.assignments) if (a.id === id) return a; }
function settingsSheet(id) {
  const a = findCat(id); const s = a.settings;
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet"><h3>${esc(a.title)}</h3><div class="hint small">Guruh: ${esc((S.overview.groups.find(g => g.groupId === S.group) || {}).name || '')}</div>
    <div class="row" style="margin-top:12px"><div class="grow"><b>Ochiq</b></div><label class="switch"><input type="checkbox" id="s-open" ${s.open ? 'checked' : ''}><span></span></label></div>
    <label class="f">Topshirish muddati (ixtiyoriy)</label><input type="datetime-local" id="s-dl" value="${toLocalInput(s.deadline)}">
    <div class="row" style="margin-top:8px"><div class="grow small">Muddatdan keyin ham qabul qilish ("kechikkan" belgisi bilan)</div><label class="switch"><input type="checkbox" id="s-late" ${s.lateAllowed ? 'checked' : ''}><span></span></label></div>
    <label class="f">Urinishlar soni (0 = cheksiz)</label><input type="number" min="0" max="99" id="s-att" value="${s.attempts}">
    <label class="f">To'g'ri javoblarni ko'rsatish</label><select id="s-rev">
      <option value="never" ${s.reveal === 'never' ? 'selected' : ''}>Ko'rsatilmasin (faqat ✓/✗)</option>
      <option value="after_deadline" ${s.reveal === 'after_deadline' ? 'selected' : ''}>Muddat tugagach ochilsin</option>
      <option value="after_attempts" ${s.reveal === 'after_attempts' ? 'selected' : ''}>Urinishlar tugagach ochilsin</option>
      <option value="always" ${s.reveal === 'always' ? 'selected' : ''}>Darhol ko'rsatilsin</option></select>
    <details ${s.timeLimit || s.openFrom || s.openUntil ? 'open' : ''} style="margin-top:12px"><summary><b>Test sozlamalari</b> <span class="hint small">(vaqt, oraliq, aralashtirish)</span></summary>
      <label class="f">Vaqt cheklovi, daqiqa (0 = yo'q)</label><input type="number" min="0" max="300" id="s-tl" value="${s.timeLimit}">
      <label class="f">Qachondan ochiq</label><input type="datetime-local" id="s-from" value="${toLocalInput(s.openFrom)}">
      <label class="f">Qachongacha ochiq</label><input type="datetime-local" id="s-until" value="${toLocalInput(s.openUntil)}">
      <div class="row" style="margin-top:8px"><div class="grow small">Savollar va variantlarni aralashtirish</div><label class="switch"><input type="checkbox" id="s-sh" ${s.shuffle ? 'checked' : ''}><span></span></label></div>
    </details>
    ${a.exercises.length ? `<details style="margin-top:12px"><summary><b>Mashqlar</b> <span class="hint small">(belgini olib tashlasangiz, mashq o'chadi)</span></summary>
      ${a.exercises.map(e => `<label class="row small" style="padding:6px 0"><input type="checkbox" style="width:auto" data-ex="${esc(e.id)}" ${e.disabled ? '' : 'checked'}>
        <span class="grow">${esc(e.title)} <span class="hint">· ${e.max} ball</span></span>${e.audio ? (e.audioMissing ? `<span class="chip bad">🔇 ${esc(e.audio)}</span>` : `<span class="chip ok">🔊 ${esc(e.audio)}</span>`) : ''}</label>`).join('')}
      <p class="hint small">Audiosi yuklanmagan mashq o'quvchilarga avtomatik yopiq turadi ("darsda bajariladi").</p></details>` : ''}
    <div class="row" style="margin-top:16px"><button class="btn sec grow" id="s-x">Bekor</button><button class="btn grow" id="s-save">Saqlash</button></div></div>`;
  document.body.appendChild(bg);
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  $('#s-x', bg).onclick = () => bg.remove();
  $('#s-save', bg).onclick = async () => {
    const settings = {
      open: $('#s-open', bg).checked, deadline: fromLocalInput($('#s-dl', bg).value), lateAllowed: $('#s-late', bg).checked,
      attempts: $('#s-att', bg).value, reveal: $('#s-rev', bg).value, timeLimit: $('#s-tl', bg).value,
      openFrom: fromLocalInput($('#s-from', bg).value), openUntil: fromLocalInput($('#s-until', bg).value), shuffle: $('#s-sh', bg).checked,
      disabled: $$('[data-ex]', bg).filter(c => !c.checked).map(c => c.dataset.ex),
    };
    try { await api('t_setAccess', { groupId: S.group, assignmentIds: [id], settings }); bg.remove(); toast('Saqlandi'); tAccess(); } catch (e) {}
  };
}

// ---------------------------------------------------------------- natijalar
async function tResults() {
  loading();
  try { if (!S.overview) await refreshOverview(); } catch (e) { return; }
  if (!S.group) { app.innerHTML = `<div class="card empty">Guruh yo'q.</div>`; return; }
  let cat = S.catalog; if (!cat) { try { cat = S.catalog = await api('t_catalog', { groupId: S.group }); } catch (e) { return; } }
  const units = cat.map(u => u.unit);
  if (S.unit === undefined) S.unit = units.length ? units[units.length - 1] : '';
  let d; try { d = await api('t_results', { groupId: S.group, unit: S.unit, practice: !!S.showPractice }); } catch (e) { return; }
  let h = `<h1>📊 Natijalar</h1><div class="card row"><select id="g" class="grow">${groupOptions(S.group)}</select>
    <select id="u" style="width:auto"><option value="">Hamma unitlar</option>${units.map(n => `<option value="${n}" ${String(n) === String(S.unit) ? 'selected' : ''}>Unit ${n}</option>`).join('')}</select></div>
    <label class="row small hint" style="margin:0 4px 6px"><input type="checkbox" id="pr" style="width:auto" ${S.showPractice ? 'checked' : ''}> Takrorlash mashqlarini (SB) ham ko'rsatish</label>`;
  if (!d.columns.length) h += `<div class="card empty">Bu guruhda hali ochilgan vazifa yo'q.</div>`;
  else if (!d.rows.length) h += `<div class="card empty">Bu guruhda o'quvchi yo'q.</div>`;
  else {
    const short = c => c.kind === 'words' ? `U${c.unit} so'zlar` : c.kind === 'quiz' ? 'QQ ' + esc(c.title.slice(-1)) : c.kind === 'test' ? 'Test ' + esc(c.title.slice(-1)) : `${esc(c.lesson)} ${c.book === 'Workbook' ? 'WB' : c.book === 'Grammar Bank' ? 'GB' : c.book === 'Vocabulary Bank' ? 'VB' : esc(c.title)}`;
    h += `<p class="hint small" style="margin:4px">Qatorga bosib, o'quvchi sahifasini oching. ✗ — umuman qilmagan, sariq — chala.</p>
      <div class="tablewrap"><table class="res"><thead><tr><th>O'quvchi</th><th>Qil-magan</th>${d.columns.map(c => `<th title="${esc(c.title)}">${short(c)}</th>`).join('')}</tr></thead><tbody>`;
    d.rows.forEach(r => {
      h += `<tr data-id="${esc(r.tgId)}"><td><b>${esc(r.name)}</b></td><td class="${r.missing ? 'c-x' : ''}">${r.missing}${r.partial ? `<span class="hint small"> +${r.partial}</span>` : ''}</td>`;
      r.cells.forEach(c => {
        if (c.words) { h += `<td class="${c.pct >= 80 ? 'c-full' : c.pct >= 40 ? 'c-mid' : 'c-low'}">${c.pct}%</td>`; return; }
        if (!c.done) { h += `<td class="c-x">✗</td>`; return; }
        const pct = c.max ? c.score / c.max : 0;
        const cls = c.done < c.total ? 'c-mid' : pct >= 0.8 ? 'c-full' : pct >= 0.5 ? 'c-mid' : 'c-low';
        h += `<td class="${cls}">${c.score}/${c.max}${c.pending ? '✍️' : ''}${c.late ? '⏰' : ''}</td>`;
      });
      h += '</tr>';
    });
    h += `</tbody></table></div><p class="hint small" style="margin:6px 4px">✍️ — tekshirilmagan yozma ish bor · ⏰ — kechikib topshirilgan</p>`;
  }
  h += `<button class="btn sec block" id="exp" style="margin-top:10px">📤 Google Sheets'ga eksport</button>`;
  app.innerHTML = h;
  $('#g').onchange = e => { S.group = e.target.value; S.catalog = null; tResults(); };
  $('#u').onchange = e => { S.unit = e.target.value; tResults(); };
  $('#pr').onchange = e => { S.showPractice = e.target.checked; tResults(); };
  $$('tr[data-id]').forEach(tr => (tr.onclick = () => go(() => tStudentPage(tr.dataset.id))));
  $('#exp').onclick = async () => {
    try { const r = await api('t_export', { groupId: S.group }); toast('"' + r.sheet + '" varag\'iga yozildi'); if (tg && tg.openLink) tg.openLink(r.url); } catch (e) {}
  };
}

// ---------------------------------------------------------------- tekshirish (yozma ishlar)
async function tReview() {
  loading();
  let list; try { list = await api('t_reviewList'); refreshOverview().catch(() => {}); } catch (e) { return; }
  let h = `<h1>✍️ Tekshirilishi kerak</h1>`;
  if (!list.length) h += `<div class="card empty">Hamma ishlar tekshirilgan 🎉</div>`;
  list.forEach(r => {
    const n = (String(r.text).match(/\S+/g) || []).length;
    h += `<div class="card" data-id="${esc(r.attemptId)}"><div class="row"><b class="grow">${esc(r.student)}</b>${r.late ? '<span class="chip warn">kechikkan</span>' : ''}</div>
      <div class="hint small">${esc(r.title)} · ${esc(r.exTitle)} · ${fmtDate(r.submittedAt)}</div>
      <div class="hint small" style="margin-top:6px">${rich(r.instruction)}</div>
      <div class="passage" style="white-space:pre-wrap">${esc(r.text)}</div><div class="hint small">${n} ta so'z</div>
      <div class="row" style="margin-top:8px"><input type="number" min="0" max="${r.max}" placeholder="Ball (0–${r.max})" style="width:130px" data-s>
      <input placeholder="Qisqa izoh (ixtiyoriy)" data-c></div>
      <button class="btn block" style="margin-top:8px" data-save>Saqlash</button></div>`;
  });
  app.innerHTML = h;
  $$('.card[data-id]').forEach(c => ($('[data-save]', c).onclick = async () => {
    const v = $('[data-s]', c).value; if (v === '') { toast('Ball kiriting'); return; }
    try { await api('t_grade', { attemptId: c.dataset.id, score: v, comment: $('[data-c]', c).value }); toast('Saqlandi ✅'); tReview(); } catch (e) {}
  }));
}

// ---------------------------------------------------------------- ko'proq: media, guruhlar, sinov
async function tMore() {
  loading();
  try { await refreshOverview(); } catch (e) { return; }
  let h = `<h1>⚙️ Sozlamalar</h1>
    <div class="card list">
      <div class="it" id="m-prev"><span style="font-size:22px">👀</span><div class="grow"><b>O'quvchi ko'rinishi (sinov)</b><div class="hint small">Barcha vazifalarni o'quvchi kabi bajarib ko'ring. Natijangiz jadvalga tushmaydi.</div></div>›</div>
      <div class="it" id="m-media"><span style="font-size:22px">🔊</span><div class="grow"><b>Audio va fayllar</b><div class="hint small">Listening audiolarini yuklash</div></div>›</div>
      <div class="it" id="m-groups"><span style="font-size:22px">🏷</span><div class="grow"><b>Guruhlar</b><div class="hint small">${S.overview.groups.length} ta guruh</div></div>›</div>
    </div>
    <div class="card small hint">Sizning Telegram ID: <b>${esc(S.overview.teacherId)}</b></div>`;
  app.innerHTML = h;
  $('#m-prev').onclick = () => { S.tab = 'preview'; teacherTab(); };
  $('#m-media').onclick = () => go(tMedia);
  $('#m-groups').onclick = () => go(tGroups);
}

async function tMedia() {
  loading();
  let d; try { d = await api('t_media'); } catch (e) { return; }
  let h = `<h1>🔊 Audio va fayllar</h1><p class="hint small" style="margin:0 4px">Audio fayl nomi kitobdagi raqam bilan bir xil bo'ladi (masalan, <b>3.01.mp3</b>). Yuklash tugmasi buni o'zi qiladi.</p>`;
  const units = [...new Set(d.audio.map(a => a.unit))];
  units.forEach(u => {
    h += `<h2>Unit ${u}</h2><div class="card list">`;
    d.audio.filter(a => a.unit === u).forEach(a => {
      h += `<div class="it" style="cursor:default"><span style="font-size:20px">${a.file ? '✅' : '❌'}</span><div class="grow"><b>${esc(a.code)}</b>
        <div class="hint small">${esc(a.used.join(', '))}</div></div>
        <label class="btn sec sm">${a.file ? 'Almashtirish' : 'Yuklash'}<input type="file" accept="audio/*" hidden data-code="${esc(a.code)}"></label></div>`;
    });
    h += '</div>';
  });
  h += `<h2>Boshqa fayl yuklash</h2><div class="card"><p class="hint small" style="margin-top:0">Yangi unit kontenti (unitN.content.json, unitN.keys.json, unitN.words.json) yoki rasm. Fayl nomi o'zgarmasdan saqlanadi.</p>
    <label class="btn sec block">📎 Fayl tanlash<input type="file" hidden id="anyf"></label></div>
    <button class="btn sec block" id="rl">🔄 Keshni yangilash</button>
    <details style="margin-top:12px"><summary class="hint small">Papkadagi fayllar (${d.files.length})</summary><div class="small hint">${d.files.map(esc).join('<br>')}</div></details>`;
  app.innerHTML = h;
  const up = async (file, name) => {
    if (file.size > 25 * 1024 * 1024) { toast('Fayl juda katta (25 MB dan oshmasin).'); return; }
    toast('Yuklanmoqda… ' + name, 60000);
    const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
    try { await api('t_upload', { name, mime: file.type || 'application/octet-stream', data }); toast('Yuklandi ✅ ' + name); tMedia(); } catch (e) {}
  };
  $$('input[data-code]').forEach(i => (i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const ext = (f.name.split('.').pop() || 'mp3').toLowerCase();
    up(f, i.dataset.code + '.' + (['mp3', 'm4a', 'ogg', 'wav', 'aac'].includes(ext) ? ext : 'mp3'));
  }));
  $('#anyf').onchange = e => { const f = e.target.files[0]; if (f) up(f, f.name.replace(/[^\w.\-]/g, '_')); };
  $('#rl').onclick = async () => { try { await api('t_reload'); S.catalog = null; toast('Yangilandi'); tMedia(); } catch (e) {} };
}

async function tGroups() {
  loading();
  try { await refreshOverview(); } catch (e) { return; }
  let h = `<h1>🏷 Guruhlar</h1>`;
  S.overview.groups.forEach(g => {
    const n = S.overview.students.filter(s => s.groupId === g.groupId && s.status === 'approved').length;
    h += `<div class="card row" data-g="${esc(g.groupId)}"><input value="${esc(g.name)}" class="grow"><button class="btn sec sm" data-save>Saqlash</button>
      <button class="btn danger sm" data-del ${n ? 'disabled title="Guruhda o\'quvchilar bor"' : ''}>🗑</button></div>`;
  });
  h += `<div class="card"><label class="f" style="margin-top:0">Yangi guruh</label><div class="row"><input id="ng" placeholder="Masalan: 2-guruh"><button class="btn sm" id="add">Qo'shish</button></div></div>`;
  app.innerHTML = h;
  $$('.card[data-g]').forEach(c => {
    $('[data-save]', c).onclick = async () => { try { await api('t_groupSave', { groupId: c.dataset.g, name: $('input', c).value }); toast('Saqlandi'); tGroups(); } catch (e) {} };
    $('[data-del]', c).onclick = async () => { if (!(await confirmAsk("Guruhni o'chirasizmi?"))) return; try { await api('t_groupDelete', { groupId: c.dataset.g }); tGroups(); } catch (e) {} };
  });
  $('#add').onclick = async () => { try { await api('t_groupSave', { name: $('#ng').value }); tGroups(); } catch (e) {} };
}

boot();
</script>
